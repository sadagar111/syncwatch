# Automatic tests: run by GitHub on every pull request and every change to main.
# A pull request can only be merged when these pass (set up in lesson 3 of docs/GIT_GUIDE.md).
# Screenshots and logs of each run: open the run on GitHub > "Artifacts" at the bottom.
# When a step fails, the end of its output also appears as red notes on the pull request.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
      SYNCWATCH_NO_POPUPS: "1"   # an error box would wait forever for a click
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: System libraries for Qt and ffmpeg (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libegl1 libgl1 libxkbcommon0 \
            libfontconfig1 libdbus-1-3 libglib2.0-0 libpulse0
      - name: Install libraries
        run: python -m pip install -r requirements.txt
      - name: Unit and integration tests
        run: python tests/ci_run.py python -m unittest discover -s tests -p "test_*.py" -v
      - name: Real-app checks (window, a room of three apps, update cycle)
        run: python tests/ci_run.py python tests/gui_checks.py all --out gui-artifacts
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gui-${{ matrix.os }}
          path: gui-artifacts
          retention-days: 14

  portable-runtime:
    name: Portable Windows runtime
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
      SYNCWATCH_NO_POPUPS: "1"   # an error box would wait forever for a click
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build the runtime exactly as releases do (checks every fingerprint)
        run: python tools/build_runtime.py --out dist
      - name: Run the real app with that runtime
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist/SyncWatch-runtime-*.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath rt
          python tests/ci_run.py rt/python.exe tests/gui_checks.py ui --out portable-artifacts
      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portable-runtime
          path: portable-artifacts
          retention-days: 14
